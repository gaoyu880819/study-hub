<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>🌻 植物大战僵尸 · 学习工作台</title>
<style>
/* ===== CSS Variables ===== */
:root {
  --grass-green: #4CAF50;
  --grass-dark: #2E7D32;
  --sunflower-yellow: #FFC107;
  --sunflower-gold: #FF8F00;
  --zombie-gray: #607D8B;
  --zombie-purple: #7B1FA2;
  --sky-blue: #87CEEB;
  --soil-brown: #795548;
  --white: #FFFFFF;
  --text-dark: #2c1810;
  --text-light: #5D4037;
  --card-bg: rgba(255,255,255,0.92);
  --nav-width: 80px;
  --shadow: 0 4px 15px rgba(0,0,0,0.1);
  --radius: 16px;
  --font-main: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
}

/* ===== Reset & Base ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font-main);
  background: linear-gradient(180deg, #87CEEB 0%, #B3E5FC 30%, #81C784 30%, #66BB6A 60%, #4CAF50 100%);
  display: flex;
  color: var(--text-dark);
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
/* Allow text selection and focus in input/textarea fields (needed for mobile keyboard) */
input, textarea {
  user-select: text;
  -webkit-user-select: text;
}

/* ===== Sky Background ===== */
.sky-bg {
  position: fixed; top: 0; left: 0; right: 0; height: 30%;
  background: linear-gradient(180deg, #64B5F6, #90CAF9);
  z-index: 0;
}
.cloud { position: fixed; z-index: 0; opacity: 0.7; animation: floatCloud 20s linear infinite; }
.cloud:nth-child(2) { top: 5%; left: 60%; animation-duration: 25s; animation-delay: -8s; }
.cloud:nth-child(3) { top: 8%; left: 30%; animation-duration: 22s; animation-delay: -15s; }
@keyframes floatCloud {
  0% { transform: translateX(-150px); }
  100% { transform: translateX(calc(100vw + 150px)); }
}

/* ===== Left Navigation ===== */
.sidebar {
  width: var(--nav-width);
  background: linear-gradient(180deg, #4a2c0a 0%, #6d3a1a 30%, #8B4513 100%);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 0;
  z-index: 10;
  box-shadow: 3px 0 15px rgba(0,0,0,0.2);
  position: relative;
  overflow-y: auto;
}
.sidebar::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; bottom: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 20px, rgba(0,0,0,0.05) 20px, rgba(0,0,0,0.05) 21px);
  pointer-events: none;
}

.nav-logo {
  font-size: 32px; margin-bottom: 8px; animation: bounce 1.5s ease infinite;
}
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }

.nav-items { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.nav-item {
  width: 64px; height: 64px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  border-radius: 14px; cursor: pointer; transition: all 0.2s;
  position: relative; color: rgba(255,255,255,0.7);
  font-size: 11px; gap: 2px;
}
.nav-item .icon { font-size: 26px; transition: transform 0.2s; }
.nav-item .label { font-size: 10px; white-space: nowrap; }
.nav-item:hover { background: rgba(255,255,255,0.12); color: #fff; }
.nav-item:hover .icon { transform: scale(1.15); }
.nav-item.active {
  background: linear-gradient(135deg, #FFC107, #FF9800);
  color: #4a2c0a; font-weight: bold;
  box-shadow: 0 0 15px rgba(255,193,7,0.5);
}
.nav-item.active .icon { transform: scale(1.1); }
.nav-badge {
  position: absolute; top: 4px; right: 4px;
  width: 18px; height: 18px; border-radius: 50%;
  background: #f44336; color: #fff; font-size: 10px;
  display: flex; align-items: center; justify-content: center;
}

/* ===== Main Content ===== */
.main-area {
  flex: 1; display: flex; flex-direction: column;
  position: relative; z-index: 1; overflow: hidden;
}

/* ===== Top Bar ===== */
.top-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 20px; background: rgba(255,255,255,0.15);
  backdrop-filter: blur(10px); z-index: 5;
}
.sun-counter {
  display: flex; align-items: center; gap: 8px;
  background: rgba(0,0,0,0.3); padding: 8px 16px; border-radius: 25px;
  color: #FFC107; font-size: 20px; font-weight: bold;
}
.sun-counter .sun-icon { font-size: 28px; animation: sunPulse 2s ease infinite; }
@keyframes sunPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.2)} }

.date-display {
  color: #fff; font-size: 15px; font-weight: 500;
  text-shadow: 0 1px 3px rgba(0,0,0,0.3);
}
.garden-status {
  display: flex; align-items: center; gap: 6px;
  background: rgba(255,255,255,0.2); padding: 6px 14px; border-radius: 20px;
  color: #fff; font-size: 13px;
}
.garden-status.safe { color: #A5D6A7; }
.garden-status.danger { color: #EF9A9A; animation: dangerPulse 0.5s ease infinite; }
@keyframes dangerPulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

/* ===== Content Panel ===== */
.content-panel {
  flex: 1; overflow-y: auto; padding: 16px;
  scroll-behavior: smooth;
}
.content-panel::-webkit-scrollbar { width: 6px; }
.content-panel::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 3px; }

.module-page { display: none; animation: fadeSlideIn 0.35s ease; }
.module-page.active { display: block; }
@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== Cards ===== */
.card {
  background: var(--card-bg); border-radius: var(--radius);
  padding: 20px; margin-bottom: 16px;
  box-shadow: var(--shadow); border: 2px solid rgba(76,175,80,0.2);
}
.card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.card-header .title { font-size: 18px; font-weight: bold; color: #2E7D32; }
.card-header .icon-title { font-size: 30px; }

/* ===== Buttons ===== */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 20px; border: none; border-radius: 25px;
  font-size: 15px; font-weight: 600; cursor: pointer;
  transition: all 0.2s; font-family: inherit;
}
.btn:active { transform: scale(0.95); }
.btn-primary {
  background: linear-gradient(135deg, #FFC107, #FF9800);
  color: #4a2c0a; box-shadow: 0 3px 10px rgba(255,152,0,0.4);
}
.btn-primary:hover { box-shadow: 0 5px 15px rgba(255,152,0,0.6); transform: translateY(-2px); }
.btn-green {
  background: linear-gradient(135deg, #66BB6A, #43A047);
  color: #fff; box-shadow: 0 3px 10px rgba(76,175,80,0.4);
}
.btn-purple {
  background: linear-gradient(135deg, #AB47BC, #7B1FA2);
  color: #fff; box-shadow: 0 3px 10px rgba(123,31,162,0.4);
}
.btn-sm { padding: 6px 14px; font-size: 13px; }

/* ===== Word Cards ===== */
.word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
.word-card {
  background: linear-gradient(135deg, #FFF8E1, #FFF3E0);
  border-radius: 14px; padding: 14px 10px; text-align: center;
  border: 2px solid #FFE082; cursor: pointer; transition: all 0.2s;
  position: relative;
}
.word-card:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
.word-card.done { border-color: #81C784; background: linear-gradient(135deg, #E8F5E9, #C8E6C9); }
.word-card.done::after {
  content: '🌻'; position: absolute; top: -8px; right: -8px; font-size: 20px;
}
.word-char { font-size: 38px; font-weight: bold; color: #5D4037; }
.word-pinyin { font-size: 13px; color: #8D6E63; margin: 4px 0; }
.word-group { font-size: 12px; color: #A1887F; }
.word-emoji { font-size: 28px; margin-bottom: 4px; }

/* ===== Progress Bar ===== */
.progress-wrap { margin: 10px 0; }
.progress-label { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 13px; color: #5D4037; }
.progress-bar {
  height: 14px; background: #E0E0E0; border-radius: 7px; overflow: hidden;
}
.progress-fill {
  height: 100%; border-radius: 7px;
  background: linear-gradient(90deg, #FFC107, #FF9800);
  transition: width 0.5s ease;
}

/* ===== Quiz Styles ===== */
.quiz-q { font-size: 24px; font-weight: bold; text-align: center; margin: 16px 0; color: #4a2c0a; }
.quiz-options { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.quiz-opt {
  width: 60px; height: 60px; border-radius: 14px; border: 2px solid #E0E0E0;
  font-size: 22px; font-weight: bold; cursor: pointer; transition: all 0.2s;
  background: #fff; display: flex; align-items: center; justify-content: center;
}
.quiz-opt:hover { border-color: #FF9800; transform: scale(1.08); }
.quiz-opt.correct { background: #C8E6C9; border-color: #4CAF50; animation: correctPop 0.3s ease; }
.quiz-opt.wrong { background: #FFCDD2; border-color: #f44336; animation: shake 0.4s ease; }
@keyframes correctPop { 0%{transform:scale(1)} 50%{transform:scale(1.2)} 100%{transform:scale(1)} }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

.quiz-input {
  width: 120px; height: 50px; font-size: 24px; text-align: center;
  border: 3px solid #E0E0E0; border-radius: 12px; outline: none;
}
.quiz-input:focus { border-color: #FF9800; }

/* ===== Poem Styles ===== */
.poem-card {
  background: linear-gradient(135deg, #FFF8E1, #F3E5F5);
  border-radius: 16px; padding: 24px; text-align: center;
  border: 2px solid #E1BEE7;
}
.poem-title { font-size: 20px; font-weight: bold; color: #7B1FA2; margin-bottom: 4px; }
.poem-author { font-size: 13px; color: #9E9E9E; margin-bottom: 12px; }
.poem-lines { font-size: 17px; line-height: 2; color: #5D4037; }
.poem-scene { font-size: 60px; margin: 12px 0; }

/* ===== Game Styles ===== */
.match-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; max-width: 400px; margin: 0 auto; }
.match-cell {
  aspect-ratio: 1; border-radius: 12px; display: flex; align-items: center; justify-content: center;
  font-size: 28px; cursor: pointer; transition: all 0.2s; border: 2px solid #E0E0E0; background: #fff;
}
.match-cell:hover { transform: scale(1.05); }
.match-cell.flipped { background: #FFF3E0; border-color: #FFC107; }
.match-cell.matched { background: #C8E6C9; border-color: #4CAF50; pointer-events: none; }

/* ===== Writing Canvas ===== */
.writing-canvas {
  border: 3px dashed #A5D6A7; border-radius: 16px; display: block;
  background: #fff; cursor: crosshair; touch-action: none; margin: 0 auto;
}

/* ===== Calendar ===== */
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.calendar-header { text-align: center; font-size: 12px; color: #757575; padding: 6px 0; }
.calendar-day {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  border-radius: 10px; font-size: 14px; cursor: pointer; transition: all 0.2s;
  background: rgba(255,255,255,0.5); position: relative;
}
.calendar-day.today { border: 2px solid #FF9800; font-weight: bold; }
.calendar-day.done { background: #C8E6C9; }
.calendar-day.done::after { content: '🌻'; font-size: 12px; position: absolute; top: -4px; right: -4px; }
.calendar-day.missed { background: #FFCDD2; }
.calendar-day.missed::after { content: '🧟'; font-size: 12px; position: absolute; top: -4px; right: -4px; }
.calendar-day.empty { background: transparent; }

/* ===== Sun Animation ===== */
.sun-pop {
  position: fixed; z-index: 1000; pointer-events: none;
  font-size: 36px; animation: sunFly 1.5s ease-out forwards;
}
@keyframes sunFly {
  0% { opacity: 1; transform: translate(0, 0) scale(0.5); }
  30% { opacity: 1; transform: translate(0, -30px) scale(1.2); }
  100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(0.3); }
}

/* ===== Reward Modal ===== */
.modal-overlay {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.5); z-index: 100; display: flex;
  align-items: center; justify-content: center;
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.modal-box {
  background: #fff; border-radius: 20px; padding: 24px;
  max-width: 360px; width: 90%; text-align: center;
  box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes popIn { from{transform:scale(0.7);opacity:0} to{transform:scale(1);opacity:1} }
.modal-icon { font-size: 60px; margin-bottom: 10px; }
.modal-title { font-size: 22px; font-weight: bold; color: #4a2c0a; margin-bottom: 8px; }
.modal-text { font-size: 14px; color: #757575; margin-bottom: 16px; }

/* ===== Tabs ===== */
.tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.tab {
  padding: 8px 18px; border-radius: 20px; font-size: 14px; cursor: pointer;
  background: rgba(255,255,255,0.7); border: 2px solid transparent;
  transition: all 0.2s;
}
.tab.active { background: #fff; border-color: #FF9800; font-weight: bold; color: #E65100; }
.tab:hover { background: #fff; }

/* ===== Recipe Cards ===== */
.recipe-card {
  background: linear-gradient(135deg, #FFF3E0, #FFF8E1);
  border-radius: 14px; padding: 14px; border: 2px solid #FFE082;
  display: flex; gap: 10px; align-items: center;
}
.recipe-emoji { font-size: 36px; }
.recipe-info { flex: 1; }
.recipe-name { font-weight: bold; color: #E65100; }
.recipe-desc { font-size: 12px; color: #8D6E63; }

/* ===== Toast ===== */
.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: #333; color: #fff; padding: 10px 24px; border-radius: 25px;
  font-size: 14px; z-index: 200; animation: toastUp 2s ease forwards;
  pointer-events: none;
}
@keyframes toastUp {
  0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
  20% { opacity: 1; transform: translateX(-50%) translateY(0); }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
}

/* ===== Responsive ===== */
@media (max-width: 600px) {
  :root { --nav-width: 64px; }
  .nav-item { width: 50px; height: 56px; font-size: 9px; }
  .nav-item .icon { font-size: 22px; }
  .nav-item .label { font-size: 8px; }
  .content-panel { padding: 10px; }
  .card { padding: 14px; }
  .word-grid { grid-template-columns: repeat(3, 1fr); }
  .match-grid { grid-template-columns: repeat(3, 1fr); }
  .calendar-day { font-size: 11px; }
}

/* ===== Error Book ===== */
.error-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px; background: #FFF3E0; border-radius: 12px; margin-bottom: 8px;
  border-left: 4px solid #FF9800;
}
.error-item .q-text { flex: 1; font-size: 14px; }
.error-item .q-badge { font-size: 11px; color: #757575; }

/* ===== Motion Section ===== */
.motion-card {
  background: linear-gradient(135deg, #E8F5E9, #B2DFDB);
  border-radius: 16px; padding: 20px; border: 2px solid #80CBC4;
  display: flex; gap: 14px; align-items: center;
}
.motion-emoji { font-size: 48px; }
.motion-duration { font-size: 28px; font-weight: bold; color: #00695C; }
.motion-name { font-size: 16px; font-weight: bold; color: #004D40; }
.motion-tip { font-size: 12px; color: #00796B; margin-top: 4px; }

/* Check button in progress items */
.check-btn {
  width: 32px; height: 32px; border-radius: 50%;
  border: 2px solid #E0E0E0; background: #fff;
  cursor: pointer; font-size: 16px; display: flex;
  align-items: center; justify-content: center;
  transition: all 0.2s;
}
.check-btn:hover { border-color: #4CAF50; }
.check-btn.checked { background: #4CAF50; border-color: #4CAF50; color: #fff; }
</style>
</head>
<body>

<!-- Sky Background -->
<div class="sky-bg"></div>
<div class="cloud" style="top:3%;left:-150px;font-size:50px;">☁️</div>
<div class="cloud" style="top:5%;left:60%;font-size:40px;">☁️</div>
<div class="cloud" style="top:8%;left:30%;font-size:35px;">☁️</div>

<!-- Sidebar -->
<nav class="sidebar" id="sidebar">
  <div class="nav-logo">🌻</div>
  <div class="nav-items" id="navItems"></div>
</nav>

<!-- Main Area -->
<div class="main-area">
  <!-- Top Bar -->
  <div class="top-bar">
    <div class="sun-counter" id="sunCounter">
      <span class="sun-icon">☀️</span>
      <span id="sunCount">0</span>
    </div>
    <div class="date-display" id="dateDisplay"></div>
    <div class="garden-status safe" id="gardenStatus">🏰 花园安全</div>
  </div>

  <!-- Content -->
  <div class="content-panel" id="contentPanel"></div>
</div>

<!-- Reward Modal -->
<div class="modal-overlay" id="rewardModal" style="display:none;">
  <div class="modal-box">
    <div class="modal-icon" id="rewardIcon">🎉</div>
    <div class="modal-title" id="rewardTitle"></div>
    <div class="modal-text" id="rewardText"></div>
    <button class="btn btn-primary" onclick="closeRewardModal()">太棒了！</button>
  </div>
</div>

<!-- Garden Modal -->
<div class="modal-overlay" id="gardenModal" style="display:none;">
  <div class="modal-box">
    <div class="modal-icon">🏰</div>
    <div class="modal-title">🎊 花园守护成功！</div>
    <div class="modal-text" id="gardenMsg"></div>
    <button class="btn btn-primary" onclick="closeGardenModal()">继续守护！</button>
  </div>
</div>

<script>
// ============================================
// DATA & STATE
// ============================================

const state = {
  sun: parseInt(localStorage.getItem('pvz_sun') || '0'),
  activeModule: localStorage.getItem('pvz_module') || 'literacy',
  today: new Date().toISOString().split('T')[0],
  calendar: JSON.parse(localStorage.getItem('pvz_calendar') || '{}'),
  // Module completion tracking
  literacyDone: JSON.parse(localStorage.getItem('pvz_literacy_done') || '[]'),
  poemDone: JSON.parse(localStorage.getItem('pvz_poem_done') || '[]'),
  mathDone: JSON.parse(localStorage.getItem('pvz_math_done') || '[]'),
  englishDone: JSON.parse(localStorage.getItem('pvz_english_done') || '[]'),
  pinyinDone: JSON.parse(localStorage.getItem('pvz_pinyin_done') || '[]'),
  writingDone: JSON.parse(localStorage.getItem('pvz_writing_done') || '[]'),
  errorBook: JSON.parse(localStorage.getItem('pvz_errors') || '[]'),
  motionDone: JSON.parse(localStorage.getItem('pvz_motion_done') || '[]'),
  // Today's content cache (regenerates daily)
  dailyWords: JSON.parse(localStorage.getItem('pvz_daily_words') || 'null'),
  dailyPoemIdx: parseInt(localStorage.getItem('pvz_daily_poem_idx') || '0'),
};

// ============================================
// MODULE CONFIG
// ============================================

const modules = [
  { id: 'literacy', icon: '🌱', label: '识字', color: '#4CAF50' },
  { id: 'poem', icon: '📜', label: '古诗', color: '#AB47BC' },
  { id: 'math', icon: '➕', label: '算术', color: '#FF7043' },
  { id: 'english', icon: '🔤', label: '英语', color: '#42A5F5' },
  { id: 'writing', icon: '✍️', label: '控笔', color: '#26A69A' },
  { id: 'errors', icon: '❌', label: '错题本', color: '#EF5350' },
  { id: 'motion', icon: '🏃', label: '运动饮食', color: '#66BB6A' },
];

// ============================================
// WORD BANK (识字) — loaded from wordbank.js (WORD_BANK)
// WORD_BANK format: {c: "字", g: 年级}
// ============================================

// ============================================
// POEM BANK (古诗)
// ============================================
const poemBank = [
  // ===== 一年级 =====
  { title:'静夜思', author:'李白', scene:'🌙🏠', lines:['床前明月光，','疑是地上霜。','举头望明月，','低头思故乡。'] },
  { title:'春晓', author:'孟浩然', scene:'🌸🐦', lines:['春眠不觉晓，','处处闻啼鸟。','夜来风雨声，','花落知多少。'] },
  { title:'悯农（其二）', author:'李绅', scene:'🌾👨‍🌾', lines:['锄禾日当午，','汗滴禾下土。','谁知盘中餐，','粒粒皆辛苦。'] },

  { title:'忆江南', author:'白居易', scene:'🌅🌸', lines:['江南好，','风景旧曾谙。','日出江花红胜火，','春来江水绿如蓝。'] },

function generateDailyContent() {
  const today = state.today;

  // Daily words — use grade-progressive word bank from wordbank.js
  // Regenerate if: no cache, or date changed, or new day
  if (!state.dailyWords || state.dailyWords._date !== today) {
    // Get learning progress: which grade the child is on
    const progress = getLiteracyProgress();
    const currentGrade = progress.currentGrade;
    const wordsForGrade = WORD_BANK.filter(w => w.g === currentGrade);

    // Pick 10 new words from current grade (sequential, not random)
    const startIdx = progress.offset % Math.max(1, wordsForGrade.length);
    let dailyWords = [];
    for (let i = 0; i < 10; i++) {
      const idx = (startIdx + i) % wordsForGrade.length;
      if (wordsForGrade[idx]) {
        dailyWords.push({
          char: wordsForGrade[idx].c,
          grade: wordsForGrade[idx].g,
          py: '',
          group: '',
          emoji: getWordEmoji(wordsForGrade[idx].c)
        });
      }
    }

    // If current grade exhausted, move to next grade
    if (dailyWords.length < 10) {
      const nextGrade = currentGrade + 1;
      if (nextGrade <= 6) {
        const nextWords = WORD_BANK.filter(w => w.g === nextGrade);
        for (let i = 0; dailyWords.length < 10 && i < nextWords.length; i++) {
          dailyWords.push({
            char: nextWords[i].c,
            grade: nextWords[i].g,
            py: '',
            group: '',
            emoji: getWordEmoji(nextWords[i].c)
          });
        }
      }
    }

    state.dailyWords = {
      _date: today,
      words: dailyWords,
      grade: currentGrade,
      offset: startIdx
    };
    state.literacyDone = [];
    localStorage.setItem('pvz_daily_words', JSON.stringify(state.dailyWords));

    // Auto-advance: mark these 10 words as "seen" so next day gets new words
    // This ensures progress even if user doesn't click "done" on every word
    const totalDone = parseInt(localStorage.getItem('pvz_literacy_total_done') || '0');
    const lastSeenDate = localStorage.getItem('pvz_literacy_last_seen_date');
    if (lastSeenDate !== today) {
      // Only advance once per day
      localStorage.setItem('pvz_literacy_total_done', totalDone + dailyWords.length);
      localStorage.setItem('pvz_literacy_last_seen_date', today);
    }
  }

  // Daily poem — sequential rotation (never repeats until all poems are used)
  const storedPoemIdx = localStorage.getItem('pvz_daily_poem_idx');
  const storedPoemDate = localStorage.getItem('pvz_daily_poem_date');
  if (storedPoemDate !== today) {
    // Advance to next poem sequentially, wrap around after last one
    const prevIdx = parseInt(storedPoemIdx || '0');
    const newIdx = (prevIdx + 1) % poemBank.length;
    state.dailyPoemIdx = newIdx;
    localStorage.setItem('pvz_daily_poem_idx', newIdx);
    localStorage.setItem('pvz_daily_poem_date', today);
    state.poemDone = [];
  } else {
    state.dailyPoemIdx = parseInt(storedPoemIdx || '0');
  }

  // Daily English words — rotate 8 words per day from the full bank
  const storedEnIdx = localStorage.getItem('pvz_daily_en_idx');
  const storedEnDate = localStorage.getItem('pvz_daily_en_date');
  if (storedEnDate !== today) {
    // Advance by 8 words each day, wrap around
    const prevIdx = parseInt(storedEnIdx || '0');
    const newIdx = (prevIdx + 8) % englishWords.length;
    localStorage.setItem('pvz_daily_en_idx', newIdx);
    localStorage.setItem('pvz_daily_en_date', today);
    state.dailyEnglishIdx = newIdx;
    // Reset today's English progress
    state.englishDone = [];
    saveState();
  } else {
    state.dailyEnglishIdx = parseInt(storedEnIdx || '0');
  }
}

// Get literacy progress: which grade and offset
function getLiteracyProgress() {
  const allDoneCount = parseInt(localStorage.getItem('pvz_literacy_total_done') || '0');
  let remaining = allDoneCount;
  for (let g = 1; g <= 6; g++) {
    const count = WORD_BANK.filter(w => w.g === g).length;
    if (remaining < count) {
      return { currentGrade: g, offset: remaining };
    }
    remaining -= count;
  }
  // All done — restart from grade 1
  return { currentGrade: 1, offset: 0 };
}

function renderNav() {
  const nav = document.getElementById('navItems');
  nav.innerHTML = modules.map(m => {
    const badge = getModuleBadge(m.id);
    return `
      <div class="nav-item ${state.activeModule === m.id ? 'active' : ''}"
           onclick="switchModule('${m.id}')" title="${m.label}">
        ${badge ? `<span class="nav-badge">${badge}</span>` : ''}
        <span class="icon">${m.icon}</span>
        <span class="label">${m.label}</span>
      </div>`;
  }).join('');
}

function getModuleBadge(moduleId) {
  const today = state.today;
  switch(moduleId) {
    case 'literacy': return state.literacyDone.length >= 10 ? '✓' : state.literacyDone.length || '';
    case 'poem': return state.poemDone.length >= 3 ? '✓' : '';
    case 'math': return state.mathDone.length >= 20 ? '✓' : '';
    case 'english': return state.englishDone.length >= 8 ? '✓' : '';
    case 'pinyin': return state.pinyinDone.length >= 12 ? '✓' : '';
    case 'writing': return state.writingDone.length >= 1 ? '✓' : '';
    case 'motion': return state.motionDone.length >= 1 ? '✓' : '';
    default: return '';
  }
}

function switchModule(moduleId) {
  state.activeModule = moduleId;
  localStorage.setItem('pvz_module', moduleId);
  renderNav();
  document.querySelectorAll('.module-page').forEach(p => p.classList.remove('active'));
  const page = document.getElementById('page-' + moduleId);
  if (page) page.classList.add('active');
  updateGardenStatus();
}

function renderLiteracy() {
  const page = document.getElementById('page-literacy');
  if (!page) return;
  const words = state.dailyWords.words || [];
  const doneCount = state.literacyDone.length;
  const allDone = doneCount >= words.length;
  const currentGrade = state.dailyWords.grade || 2;
  const progress = getLiteracyProgress();

  // Calculate overall progress
  const totalWords = WORD_BANK.length;
  const totalDone = parseInt(localStorage.getItem('pvz_literacy_total_done') || '0');
  const gradeCounts = {};
  for (let g = 1; g <= 6; g++) {
    gradeCounts[g] = WORD_BANK.filter(w => w.g === g).length;

// Combined: speak first, then mark as done on double-click or dedicated button
let _wordClickTimers = {};
function handleWordClick(index, char, pinyin, group, el) {
  // Speak the character via TTS
  speak(char, 'zh-CN');

  // Clear previous timer for this card
  if (_wordClickTimers[index]) clearTimeout(_wordClickTimers[index]);

  // If already done, just speak
  if (state.literacyDone.includes(index)) return;

  // Visual feedback: brief highlight
  el.style.transform = 'scale(1.08)';
  el.style.boxShadow = '0 0 20px rgba(255,193,7,0.6)';
  setTimeout(() => {
    el.style.transform = '';
    el.style.boxShadow = '';
  }, 300);

  // Second click within 1.5s = mark as done
  _wordClickTimers[index] = setTimeout(() => {
    delete _wordClickTimers[index];
  }, 1500);

  // If already has a pending timer, this is the second click
  if (el.dataset.pending === 'true') {
    delete _wordClickTimers[index];
    el.dataset.pending = 'false';
    markWordDone(index, el);
  } else {
    el.dataset.pending = 'true';
  }
}

// Canvas functions
function initCanvas() {
  const canvas = document.getElementById('writingCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#f5f5f5';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // Draw guide lines
  ctx.strokeStyle = '#E0E0E0';
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 5]);
  for (let y = 50; y < canvas.height; y += 50) {
    ctx.beginPath();
    ctx.moveTo(20, y);
    ctx.lineTo(canvas.width - 20, y);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  let drawing = false;
  canvas.addEventListener('mousedown', e => { drawing = true; draw(e); });
  canvas.addEventListener('mousemove', e => { if(drawing) draw(e); });
  canvas.addEventListener('mouseup', () => drawing = false);
  canvas.addEventListener('mouseleave', () => drawing = false);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); drawing = true; draw(e.touches[0]); });
  canvas.addEventListener('touchmove', e => { e.preventDefault(); if(drawing) draw(e.touches[0]); });
  canvas.addEventListener('touchend', () => drawing = false);

  function draw(e) {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (canvas.width / rect.width);
    const y = (e.clientY - rect.top) * (canvas.height / rect.height);
    ctx.fillStyle = '#5D4037';
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fill();
  }
}

function clearCanvas() {
  const canvas = document.getElementById('writingCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#f5f5f5';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#E0E0E0';
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 5]);
  for (let y = 50; y < canvas.height; y += 50) {
    ctx.beginPath();
    ctx.moveTo(20, y);
    ctx.lineTo(canvas.width - 20, y);
    ctx.stroke();
  }
  ctx.setLineDash([]);
}

function generateMathQuiz() {
  const qs = [];
  // 10 addition/subtraction (2-digit)
  for (let i = 0; i < 10; i++) {
    const a = Math.floor(Math.random() * 90) + 10;
    const b = Math.floor(Math.random() * (a - 1)) + 1;
    const op = Math.random() > 0.5 ? '+' : '-';
    if (op === '+') {
      const b2 = Math.floor(Math.random() * (99 - a)) + 1;
      qs.push({ q: `${a} + ${b2} = ?`, a: a + b2, type: 'addsub' });
    } else {
      qs.push({ q: `${a} - ${b} = ?`, a: a - b, type: 'addsub' });
    }
  }
  // 10 multiplication/division (single digit)
  for (let i = 0; i < 10; i++) {
    const a = Math.floor(Math.random() * 9) + 1;
    const b = Math.floor(Math.random() * 9) + 1;
    if (i < 5) {
      qs.push({ q: `${a} × ${b} = ?`, a: a * b, type: 'muldiv' });
    } else {
      const product = a * b;
      qs.push({ q: `${product} ÷ ${a} = ?`, a: b, type: 'muldiv' });
    }
  }
  return qs;
}

let currentMathType = 'addsub';

function switchMathTab(type) {
  currentMathType = type;
  document.querySelectorAll('#page-math .tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && type === 'addsub') || (i === 1 && type === 'muldiv'));
  });
  renderMathQuiz();
}

function renderMathQuiz() {
  const area = document.getElementById('mathQuizArea');
  if (!area) return;
  const stored = localStorage.getItem('pvz_math_quiz');
  const quiz = stored ? JSON.parse(stored) : null;
  if (!quiz) return;

  const filtered = quiz.questions
    .map((q, i) => ({...q, idx: i}))
    .filter(q => q.type === currentMathType);

  area.innerHTML = filtered.map(q => {
    const isDone = state.mathDone.includes(q.idx);
    return `
      <div style="display:flex;align-items:center;gap:10px;padding:10px;background:${isDone?'#E8F5E9':'#fff'};border-radius:10px;margin-bottom:6px;">
        <span style="font-size:18px;font-weight:bold;min-width:80px;">${q.q}</span>
        <input type="text" inputmode="numeric" pattern="[0-9]*" class="quiz-input" id="mathAns${q.idx}" ${isDone?'disabled':''}
               onkeydown="if(event.key==='Enter')checkMathAnswer(${q.idx},${q.a})">
        ${isDone ? '<span style="color:#4CAF50;font-size:20px;">✅</span>' :
          `<button class="btn btn-green btn-sm" onclick="checkMathAnswer(${q.idx},${q.a})">检查</button>`}
      </div>`;
  }).join('');
}

function checkMathAnswer(idx, correct) {
  const input = document.getElementById('mathAns' + idx);
  if (!input) return;
  const userAns = parseInt(input.value);
  if (isNaN(userAns)) { showToast('请输入答案哦~'); return; }
  if (userAns === correct) {
    state.mathDone.push(idx);
    saveState();
    showToast('✅ 回答正确！太聪明了！');
    renderMath();
    renderNav();
    updateGardenStatus();
    if (state.mathDone.length >= 20) {
      showToast('🏆 算术全部通关！');
    }
  } else {
    // Add to error book
    addError('算术', `题目`, `${input.parentElement.querySelector('span').textContent} → 正确答案: ${correct}`);
    input.style.borderColor = '#f44336';
    showToast('❌ 再想想哦~已加入错题本');
    setTimeout(() => { input.style.borderColor = '#E0E0E0'; input.value = ''; }, 1000);
  }
}

function speakAllEnglish() {
  // Speak all words sequentially
  if (!('speechSynthesis' in window)) {
    showToast('⚠️ 当前浏览器不支持语音朗读');
    return;
  }
  activateSpeech();
  window.speechSynthesis.cancel();

  const enIdx = state.dailyEnglishIdx || 0;
  const words = [];
  for (let i = 0; i < 8; i++) {
    words.push(englishWords[(enIdx + i) % englishWords.length].en);
  }
  let idx = 0;
  function speakNext() {
    if (idx >= words.length) return;
    const u = new SpeechSynthesisUtterance(words[idx]);
    u.lang = 'en-US';
    u.rate = 0.7;
    u.pitch = 1.0;
    if (_enVoice) u.voice = _enVoice;
    u.onend = () => { idx++; speakNext(); };

  renderEnglish();
  updateGardenStatus();
}

function startEnglishGame() {
  // Use first 6 of today's English words for the matching game (keep it manageable)
  const enIdx = state.dailyEnglishIdx || 0;
  const pairs = [];
  for (let i = 0; i < 6; i++) {
    pairs.push(englishWords[(enIdx + i) % englishWords.length]);
  }
  const cards = [...pairs, ...pairs].map((w, i) => ({
    id: i, word: w.en, emoji: w.emoji, pairId: i % pairs.length
  })).sort(() => Math.random() - 0.5);

  englishGameState = { cards, flipped: [], matched: [], started: true };
  renderEnglishGame();
}

function renderEnglishGame() {
  const grid = document.getElementById('englishMatchGrid');
  if (!grid) return;
  grid.innerHTML = englishGameState.cards.map((c, i) => {
    const flipped = englishGameState.flipped.includes(i);
    const matched = englishGameState.matched.includes(c.pairId);
    return `
      <div class="match-cell ${flipped || matched ? 'flipped' : ''} ${matched ? 'matched' : ''}"
           onclick="flipEnglishCard(${i})">
        ${flipped || matched ? c.emoji : '?'}
      </div>`;
  }).join('');
}

function flipEnglishCard(index) {
  if (englishGameState.flipped.length >= 2) return;
  if (englishGameState.flipped.includes(index)) return;
  if (englishGameState.matched.includes(englishGameState.cards[index].pairId)) return;

  englishGameState.flipped.push(index);
  renderEnglishGame();

  if (englishGameState.flipped.length === 2) {
    const [a, b] = englishGameState.flipped;
    const cardA = englishGameState.cards[a];
    const cardB = englishGameState.cards[b];

    if (cardA.pairId === cardB.pairId && a !== b) {
      englishGameState.matched.push(cardA.pairId);
      englishGameState.flipped = [];
      renderEnglishGame();
      if (englishGameState.matched.length === 6) {
        showToast('🎉 全部消除！太厉害了！');
      }
    } else {
      setTimeout(() => {
        englishGameState.flipped = [];
        renderEnglishGame();
      }, 800);
    }
  }
}

// ===== Writing Canvas with Templates =====
function initWritingCanvas() {
  const canvas = document.getElementById('writingCanvas2');
  if (!canvas) return;

  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;

  ctx.fillStyle = '#fffef7';
  ctx.fillRect(0, 0, w, h);

  ctx.strokeStyle = '#C8E6C9';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 4]);

  const margin = 30;

  switch (writingMode) {
    case 'line':
      for (let y = margin + 10; y < h - margin; y += 30) {
        ctx.beginPath();
        ctx.moveTo(margin, y);
        ctx.lineTo(w - margin, y);
        ctx.stroke();
        ctx.fillStyle = '#A5D6A7';
        drawArrow(ctx, w - margin, y, margin + 10, y);
      }
      break;
    case 'zigzag':
      for (let x = margin + 10; x < w - margin; x += 30) {
        ctx.beginPath();
        ctx.moveTo(x, margin);
        ctx.lineTo(x, h - margin);
        ctx.stroke();
      }
      break;
    case 'wave':
      for (let y = margin + 15; y < h - margin; y += 40) {
        ctx.beginPath();
        ctx.moveTo(margin, y);
        for (let x = margin; x < w - margin; x += 4) {
          ctx.lineTo(x, y + Math.sin((x - margin) * 0.04) * 12);
        }
        ctx.stroke();
      }
      break;
    case 'circle':
      const cx = w / 2, cy = h / 2;
      for (let r = 20; r < Math.min(w, h) / 2 - margin; r += 30) {
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.moveTo(cx, margin); ctx.lineTo(cx, h - margin);
      ctx.moveTo(margin, cy); ctx.lineTo(w - margin, cy);
      ctx.stroke();
      break;
  }

  ctx.setLineDash([]);

  ctx.fillStyle = '#C8E6C9';
  ctx.font = '12px "PingFang SC", "Microsoft YaHei", sans-serif';
  const titles = { line: '跟着绿色虚线画横线 →', zigzag: '跟着绿色虚线画竖线 ↓', wave: '跟着波浪线描红 〰', circle: '在虚线上画圆圈 ○' };
  ctx.fillText(titles[writingMode] || '', margin, margin - 8);

  let drawing = false;
  let lastX = 0, lastY = 0;
  const strokes = [];

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (w / rect.width),
      y: (e.clientY - rect.top) * (h / rect.height)
    };
  }

  function startDraw(e) {
    drawing = true;
    const pos = getPos(e.touches ? e.touches[0] : e);
    lastX = pos.x; lastY = pos.y;
    strokes.push([]);
    strokes[strokes.length-1].push({x: lastX, y: lastY});
  }

  function doDraw(e) {
    if (!drawing) return;
    e.preventDefault();
    const pos = getPos(e.touches ? e.touches[0] : e);
    ctx.strokeStyle = '#5D4037';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    lastX = pos.x; lastY = pos.y;
    strokes[strokes.length-1].push({x: lastX, y: lastY});
  }

  function endDraw() {
    drawing = false;
    if (strokes.length > 0 && strokes[strokes.length-1].length === 1) {
      strokes.pop();
    }
  }

  canvas.onmousedown = startDraw;
  canvas.onmousemove = doDraw;
  canvas.onmouseup = endDraw;
  canvas.onmouseleave = endDraw;

  canvas.ontouchstart = startDraw;
  canvas.ontouchmove = doDraw;
  canvas.ontouchend = endDraw;

  canvas._strokes = strokes;
}

function drawArrow(ctx, fromX, fromY, toX, toY) {
  const angle = Math.atan2(toY - fromY, toX - fromX);
  const size = 6;
  ctx.beginPath();
  ctx.moveTo(fromX, fromY);
  ctx.lineTo(fromX - size * Math.cos(angle - 0.5), fromY - size * Math.sin(angle - 0.5));
  ctx.moveTo(fromX, fromY);
  ctx.lineTo(fromX - size * Math.cos(angle + 0.5), fromY - size * Math.sin(angle + 0.5));
  ctx.stroke();
}

function clearWritingCanvas() {
  initWritingCanvas();
}

function undoWritingCanvas() {
  const canvas = document.getElementById('writingCanvas2');
  if (!canvas || !canvas._strokes) return;
  canvas._strokes.pop();
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fffef7';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  initWritingCanvas();
  if (canvas._strokes.length > 0) {
    ctx.strokeStyle = '#5D4037';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    canvas._strokes.forEach(stroke => {
      if (stroke.length < 2) return;
      ctx.beginPath();
      ctx.moveTo(stroke[0].x, stroke[0].y);
      for (let i = 1; i < stroke.length; i++) {
        ctx.lineTo(stroke[i].x, stroke[i].y);
      }
      ctx.stroke();
    });
  }
}

  const btn = event.target;

  if (!frameDiv) return;

  const iframe = frameDiv.querySelector('iframe');

  const embedUrl = `https://player.bilibili.com/player.html?bvid=${bvid}&page=${page}&autoplay=1&danmaku=0&high_quality=1`;

  frameDiv.style.display = 'block';

  frameDiv.scrollIntoView({ behavior: 'smooth' });
  showToast(`▶ 正在播放：${title}`);
}

// ============================================

function renderCalendar() {
  const pages = document.querySelectorAll('.module-page');
  // Add calendar to the last module page
  const lastPage = pages[pages.length - 1];
  if (!lastPage) return;

  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  let calHTML = '';
  const headers = ['日','一','二','三','四','五','六'];
  headers.forEach(h => { calHTML += `<div class="calendar-header">${h}</div>`; });

  for (let i = 0; i < firstDay; i++) {
    calHTML += `<div class="calendar-day empty"></div>`;
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = d === now.getDate();
    const record = state.calendar[dateStr];
    const isDone = record && record.allDone;
    const isMissed = !isDone && dateStr < state.today;
    let cls = 'calendar-day';
    if (isToday) cls += ' today';
    if (isDone) cls += ' done';
    else if (isMissed) cls += ' missed';

    calHTML += `<div class="${cls}" title="${dateStr}">${d}</div>`;
  }

  const calendarCard = document.createElement('div');
  calendarCard.className = 'card';
  calendarCard.innerHTML = `
    <div class="card-header">
      <span class="icon-title">📅</span>
      <span class="title">打卡日历 · ${year}年${month+1}月</span>
    </div>
    <div class="calendar-grid">${calHTML}</div>
    <div style="display:flex;gap:16px;margin-top:12px;font-size:12px;color:#757575;justify-content:center;">
      <span>🌻 全勤打卡</span>
      <span>🧟 漏打卡</span>
      <span>📅 今日</span>
    </div>
    <div style="text-align:center;margin-top:14px;">
      <button class="btn btn-primary btn-sm" onclick="generateMonthlyReport()">📊 生成本月学习报告</button>
    </div>
  `;
  lastPage.appendChild(calendarCard);
}

function generateMonthlyReport() {
  const now = new Date();
  const month = now.getMonth() + 1;
  const totalDays = Object.values(state.calendar).filter(c => c.allDone).length;
  const wordsLearned = state.literacyDone.length;
  const errorsCount = state.errorBook.length;

  showReward(
    `📊 ${month}月学习报告`,
    '📊',
    `🌻 全勤天数：${totalDays}天\n📖 今日识字：${wordsLearned}个\n❌ 错题累计：${errorsCount}条\n☀️ 阳光总数：${state.sun}颗\n\n继续加油，守护花园！`
  );
}

// ============================================
// UTILITY: Text to Speech (Robust Multi-platform)
// ============================================

let _speechReady = false;
let _zhVoice = null;
let _enVoice = null;

// Pre-load voices — iOS Safari needs this
// STRICTLY prefer Mandarin (zh-CN), NEVER use Cantonese (zh-HK)
// Also load English voice for accurate English pronunciation
function initSpeech() {
  if (!('speechSynthesis' in window)) return;
  const voices = window.speechSynthesis.getVoices();
  if (voices.length > 0) {
    // Priority: zh-CN first, then zh-TW (Taiwan Mandarin), NEVER zh-HK (Cantonese)
    _zhVoice = voices.find(v => v.lang === 'zh-CN' || v.lang === 'zh-cn')
           || voices.find(v => v.lang.startsWith('zh-CN') || v.lang.startsWith('zh-cn'))
           || voices.find(v => v.lang.startsWith('zh-TW') || v.lang.startsWith('zh-tw'))
           || voices.find(v => v.lang === 'zh' && !v.name.includes('HK') && !v.name.includes('Cantonese'))
           || voices.find(v => v.lang.startsWith('zh') && !v.lang.includes('HK') && !v.name.includes('Cantonese') && !v.name.includes('粤'));

    // English voice: prefer high-quality en-US voices
    // Search by name first (Google/Microsoft voices tend to be better quality)
    _enVoice = voices.find(v => (v.lang === 'en-US' || v.lang === 'en-us') && v.name.includes('Google'))
           || voices.find(v => (v.lang === 'en-US' || v.lang === 'en-us') && v.name.includes('Microsoft'))
           || voices.find(v => (v.lang === 'en-US' || v.lang === 'en-us') && v.name.includes('Samantha'))
           || voices.find(v => (v.lang === 'en-US' || v.lang === 'en-us') && v.name.includes('Alex'))
           || voices.find(v => v.lang === 'en-US' || v.lang === 'en-us')
           || voices.find(v => v.lang.startsWith('en-US') || v.lang.startsWith('en-us'))
           || voices.find(v => v.lang === 'en-GB' || v.lang === 'en-gb')
           || voices.find(v => v.lang.startsWith('en-GB') || v.lang.startsWith('en-gb'))
           || voices.find(v => v.lang === 'en')
           || voices.find(v => v.lang.startsWith('en'));

    // Debug: log available voices for troubleshooting
    console.log('Speech voices loaded:', voices.length, '| EN voice:', _enVoice?.name, '| ZH voice:', _zhVoice?.name);
  }
}
initSpeech();
window.speechSynthesis?.addEventListener('voiceschanged', initSpeech);

// Activate speech on first user tap (required by mobile browsers)
function activateSpeech() {
  if (_speechReady) return;
  if (!('speechSynthesis' in window)) return;
  // Speak a silent utterance to "unlock" the audio context
  const u = new SpeechSynthesisUtterance('');
  u.volume = 0;
  u.rate = 2;
  window.speechSynthesis.speak(u);
  _speechReady = true;
}

// Listen for first user interaction globally
['click','touchstart'].forEach(evt => {
  document.addEventListener(evt, activateSpeech, { once: true });
});

function speak(text, lang = 'zh-CN') {
  if (!('speechSynthesis' in window)) {
    showToast('⚠️ 当前浏览器不支持语音朗读');
    return;
  }

  // Ensure speech context is activated
  activateSpeech();

  // Cancel any ongoing speech
  window.speechSynthesis.cancel();

  // Re-init voices in case they loaded late
  if (!_zhVoice) initSpeech();

  const utterance = new SpeechSynthesisUtterance(text);
  // Force lang to zh-CN for all Chinese speech (never zh-HK Cantonese)
  utterance.lang = lang.startsWith('zh') ? 'zh-CN' : lang;
  utterance.rate = lang.startsWith('zh') ? 0.8 : 0.85;
  utterance.pitch = 1.1;
  utterance.volume = 1;

  // Use pre-loaded Mandarin voice if available
  if (_zhVoice && lang.startsWith('zh')) {
    utterance.voice = _zhVoice;
  }

  // iOS Safari fix: if voices empty, retry after voices load
  if (window.speechSynthesis.getVoices().length === 0) {
    window.speechSynthesis.addEventListener('voiceschanged', () => {
      initSpeech();
      if (_zhVoice && lang.startsWith('zh')) utterance.voice = _zhVoice;
      window.speechSynthesis.speak(utterance);
    }, { once: true });
    return;
  }

  // Chrome on Android fix: sometimes speech just silently fails,
  // resume if paused and retry
  window.speechSynthesis.speak(utterance);

  // Safety: if speech gets stuck paused (Chrome bug), resume it
  setTimeout(() => {
    if (window.speechSynthesis.paused) {
      window.speechSynthesis.resume();
    }
  }, 100);
}

// ============================================
// Speak single Chinese character with explanation
// ============================================
function speakChar(char, pinyin, group) {
  const fullText = `${char}，拼音：${pinyin}，组词：${group}`;
  speak(fullText, 'zh-CN');
}

// ============================================
// Speak English word
// ============================================
function speakEnglishWord(en, zh) {
  // Use English first then Chinese explanation
  if (!('speechSynthesis' in window)) {
    showToast('⚠️ 当前浏览器不支持语音');
    return;
  }
  activateSpeech();
  window.speechSynthesis.cancel();

  // Force reload voices if not loaded yet
  if (!_enVoice || !_zhVoice) initSpeech();

  // If still no voices, retry after a short delay (iOS Safari loads voices async)
  if (!_enVoice && window.speechSynthesis.getVoices().length === 0) {
    showToast('🔊 正在加载语音引擎...');
    window.speechSynthesis.addEventListener('voiceschanged', () => {
      initSpeech();
      speakEnglishWord(en, zh);
    }, { once: true });
    return;
  }

  // First utterance: English word (slow for clarity)
  const u1 = new SpeechSynthesisUtterance(en);
  u1.lang = 'en-US';
  u1.rate = 0.7;
  u1.pitch = 1.0;
  u1.volume = 1;
  if (_enVoice) u1.voice = _enVoice;

  // Second utterance: Chinese meaning
  const u2 = new SpeechSynthesisUtterance(`，${zh}`);
  u2.lang = 'zh-CN';
  u2.rate = 0.8;
  u2.pitch = 1.1;
  u2.volume = 1;
  if (_zhVoice) u2.voice = _zhVoice;

  // Third utterance: repeat English word
  const u3 = new SpeechSynthesisUtterance(en);
  u3.lang = 'en-US';
  u3.rate = 0.7;
  u3.pitch = 1.0;
  u3.volume = 1;
  if (_enVoice) u3.voice = _enVoice;

  // Speak sequentially: English -> Chinese -> English
  u1.addEventListener('end', () => {
    u2.addEventListener('end', () => {
      window.speechSynthesis.speak(u3);
    });
    window.speechSynthesis.speak(u2);
  });

  window.speechSynthesis.speak(u1);
}

// ============================================
// Speak pinyin syllable
// ============================================
function speakPinyin(py) {
  // Map pinyin letters/combinations to Chinese pronunciation descriptions
  // so TTS reads them as Chinese pinyin, not English letters
  const pinyinMap = {
    // 声母
    'b': 'bō 播', 'p': 'pō 坡', 'm': 'mō 摸', 'f': 'fō 佛',
    'd': 'dē 得', 't': 'tè 特', 'n': 'nè 呢', 'l': 'lè 乐',
    'g': 'gē 哥', 'k': 'kē 科', 'h': 'hē 喝',
    'j': 'jī 鸡', 'q': 'qī 七', 'x': 'xī 西',
    'zh': 'zhī 知', 'ch': 'chī 吃', 'sh': 'shī 诗', 'r': 'rì 日',
    'z': 'zī 资', 'c': 'cī 疵', 's': 'sī 思',
    'y': 'yī 衣', 'w': 'wū 屋',
    // 韵母
    'a': 'ā 啊', 'o': 'ō 喔', 'e': 'ē 鹅',
    'i': 'yī 衣', 'u': 'wū 乌', 'ü': 'yú 鱼',
    'ai': 'āi 哀', 'ei': 'ēi 欸', 'ui': 'uī 威',
    'ao': 'āo 凹', 'ou': 'ōu 欧', 'iu': 'yōu 优',
    'ie': 'yē 耶', 'üe': 'yuē 约', 'er': 'ér 儿',
    'an': 'ān 安', 'en': 'ēn 恩', 'in': 'yīn 因', 'un': 'wēn 温', 'ün': 'yūn 晕',
    'ang': 'āng 昂', 'eng': 'ēng 鞥', 'ing': 'yīng 英', 'ong': 'ōng 轰的韵母',
    // 整体认读
    'zhi': 'zhī 知', 'chi': 'chī 吃', 'shi': 'shī 诗', 'ri': 'rì 日',
    'zi': 'zī 资', 'ci': 'cī 疵', 'si': 'sī 思',
    'yi': 'yī 衣', 'wu': 'wū 乌', 'yu': 'yú 鱼',
    'ye': 'yē 耶', 'yue': 'yuē 约', 'yuan': 'yuān 冤',
    'yin': 'yīn 因', 'yun': 'yūn 晕', 'ying': 'yīng 英',
  };

  const pronunciation = pinyinMap[py] || py;
  speak(pronunciation, 'zh-CN');
}

function checkAllAndDefend() {
  const today = state.today;
  const literacyDone = state.literacyDone.length >= (state.dailyWords.words || []).length;
  const poemDone = state.poemDone.length >= 3;
  const mathDone = state.mathDone.length >= 20;
  const englishDone = state.englishDone.length >= 8;
  const writingDone = state.writingDone.includes(today);
  const motionDone = state.motionDone.includes(today);

  if (literacyDone && poemDone && mathDone && englishDone && writingDone && motionDone) {
    if (!state.calendar[today]?.allDone) {
      markDayComplete();
    }
  }

  // Use original function directly to avoid recursion
  originalUpdateGardenStatus();
}

updateGardenStatus = function() {
  originalUpdateGardenStatus();
  checkAllAndDefend();
};

// Service Worker for PWA - auto-update on every visit
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').then(reg => {
      console.log('SW registered:', reg.scope);
      // Check for SW updates every 30 seconds
      setInterval(() => {
        reg.update();
      }, 30000);
    }).catch(err => {
      console.log('SW registration failed:', err);
    });

    // When a new SW takes control, reload page immediately to get latest content
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (refreshing) return;
      refreshing = true;
      window.location.reload();
    });
  });
}

// PWA install prompt
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  // Show install hint after 3 seconds on page
  setTimeout(() => {
    if (deferredPrompt && !window.matchMedia('(display-mode: standalone)').matches) {
      showInstallHint();
    }
  }, 3000);
});

function showInstallHint() {
  const el = document.createElement('div');
  el.id = 'installHint';
  el.style.cssText = `
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:#fff;border-radius:25px;padding:12px 24px;
    box-shadow:0 8px 30px rgba(0,0,0,0.2);z-index:300;
    display:flex;align-items:center;gap:10px;font-size:14px;
    animation: toastUp 0.5s ease;
    cursor:pointer;
  `;
  el.innerHTML = '📲 <b>添加到桌面</b>，像App一样使用！';
  el.onclick = () => {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(() => {
        deferredPrompt = null;
        el.remove();
      });
    } else {
      el.remove();
    }
  };
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 10000);
}

window.addEventListener('appinstalled', () => {
  const el = document.getElementById('installHint');
  if (el) el.remove();
  deferredPrompt = null;
});
