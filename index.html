.date-display {

  text-shadow: 0 1px 3px rgba(0,0,0,0.3);
}
.garden-status {

.garden-status.safe { color: #A5D6A7; }

@keyframes dangerPulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

/* ===== Content Panel ===== */
.content-panel {

.module-page { display: none; animation: fadeSlideIn 0.35s ease; }
.module-page.active { display: block; }
@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(15px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ===== Cards ===== */
.card {
  background: var(--card-bg); border-radius: var(--radius);
  padding: 20px; margin-bottom: 16px;
  box-shadow: var(--shadow); border: 2px solid rgba(76,175,80,0.2);
}
.card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.card-header .title { font-size: 18px; font-weight: bold; color: #2E7D32; }
.card-header .icon-title { font-size: 30px; }

.btn {

  background: linear-gradient(135deg, #FFC107, #FF9800);

.btn-primary:hover { box-shadow: 0 5px 15px rgba(255,152,0,0.6); transform: translateY(-2px); }
.btn-green {
  background: linear-gradient(135deg, #66BB6A, #43A047);
  color: #fff; box-shadow: 0 3px 10px rgba(76,175,80,0.4);

.btn-purple {
  background: linear-gradient(135deg, #AB47BC, #7B1FA2);

.btn-sm { padding: 6px 14px; font-size: 13px; }

.word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }

.word-char { font-size: 38px; font-weight: bold; color: #5D4037; }

function generateDailyContent() {
  const today = state.today;

  // Daily words — use grade-progressive word bank from wordbank.js
  if (!state.dailyWords || state.dailyWords._date !== today) {
    // Get learning progress: which grade the child is on
    const progress = getLiteracyProgress();
    const currentGrade = progress.currentGrade;
    const wordsForGrade = WORD_BANK.filter(w => w.g === currentGrade);

    // Pick 10 new words from current grade (sequential, not random)
    const startIdx = progress.offset % Math.max(1, wordsForGrade.length);
    let dailyWords = [];
    for (let i = 0; i < 10; i++) {
      const idx = (startIdx + i) % wordsForGrade.length;
      if (wordsForGrade[idx]) {
        dailyWords.push({
          char: wordsForGrade[idx].c,
          grade: wordsForGrade[idx].g,
          // Simple pinyin will be generated by browser TTS
          py: '', // Will be spoken, not displayed as primary
          group: '',
          emoji: getWordEmoji(wordsForGrade[idx].c)
        });
      }
    }

    // If current grade exhausted, move to next grade
    if (dailyWords.length < 10) {
      const nextGrade = currentGrade + 1;
      if (nextGrade <= 6) {
        const nextWords = WORD_BANK.filter(w => w.g === nextGrade);
        for (let i = 0; dailyWords.length < 10 && i < nextWords.length; i++) {
          dailyWords.push({
            char: nextWords[i].c,
            grade: nextWords[i].g,
            py: '',
            group: '',
            emoji: getWordEmoji(nextWords[i].c)
          });
        }
      }
    }

    state.dailyWords = {
      _date: today,
      words: dailyWords,
      grade: currentGrade,
      offset: startIdx
    };
    state.literacyDone = [];
    localStorage.setItem('pvz_daily_words', JSON.stringify(state.dailyWords));
  }

  // Daily poem (unchanged)
  const storedPoemIdx = localStorage.getItem('pvz_daily_poem_idx');
  const storedPoemDate = localStorage.getItem('pvz_daily_poem_date');
  if (storedPoemDate !== today) {
    const idx = Math.floor(Math.random() * poemBank.length);
    state.dailyPoemIdx = idx;
    localStorage.setItem('pvz_daily_poem_idx', idx);
    localStorage.setItem('pvz_daily_poem_date', today);
    state.poemDone = [];
  } else {
    state.dailyPoemIdx = parseInt(storedPoemIdx || '0');
  }
}

// Get literacy progress: which grade and offset
function getLiteracyProgress() {
  const allDoneCount = parseInt(localStorage.getItem('pvz_literacy_total_done') || '0');
  let remaining = allDoneCount;
  for (let g = 1; g <= 6; g++) {
    const count = WORD_BANK.filter(w => w.g === g).length;
    if (remaining < count) {
      return { currentGrade: g, offset: remaining };
    }
    remaining -= count;
  }
  // All done — restart from grade 1
  return { currentGrade: 1, offset: 0 };
}

    '右':'👉','口':'👄','目':'👁️','耳':'👂','手':'🤚','足':'🦶','心':'❤️','星':'⭐',

// Combined: speak first, then mark as done on double-click or dedicated button
let _wordClickTimers = {};
function handleWordClick(index, char, pinyin, group, el) {
  // Speak the character via TTS
  speak(char, 'zh-CN');

  // Clear previous timer for this card
  if (_wordClickTimers[index]) clearTimeout(_wordClickTimers[index]);

  // If already done, just speak
  if (state.literacyDone.includes(index)) return;

  // Visual feedback: brief highlight
  el.style.transform = 'scale(1.08)';
  el.style.boxShadow = '0 0 20px rgba(255,193,7,0.6)';
  setTimeout(() => {
    el.style.transform = '';
    el.style.boxShadow = '';
  }, 300);

  // Second click within 1.5s = mark as done
  _wordClickTimers[index] = setTimeout(() => {
    delete _wordClickTimers[index];
  }, 1500);

  // If already has a pending timer, this is the second click
  if (el.dataset.pending === 'true') {
    delete _wordClickTimers[index];
    el.dataset.pending = 'false';
    markWordDone(index, el);
  } else {
    el.dataset.pending = 'true';
  }
}

// Canvas functions
function initCanvas() {
  const canvas = document.getElementById('writingCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#f5f5f5';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  // Draw guide lines
  ctx.strokeStyle = '#E0E0E0';
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 5]);
  for (let y = 50; y < canvas.height; y += 50) {
    ctx.beginPath();
    ctx.moveTo(20, y);
    ctx.lineTo(canvas.width - 20, y);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  let drawing = false;
  canvas.addEventListener('mousedown', e => { drawing = true; draw(e); });
  canvas.addEventListener('mousemove', e => { if(drawing) draw(e); });
  canvas.addEventListener('mouseup', () => drawing = false);
  canvas.addEventListener('mouseleave', () => drawing = false);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); drawing = true; draw(e.touches[0]); });
  canvas.addEventListener('touchmove', e => { e.preventDefault(); if(drawing) draw(e.touches[0]); });
  canvas.addEventListener('touchend', () => drawing = false);

  function draw(e) {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (canvas.width / rect.width);
    const y = (e.clientY - rect.top) * (canvas.height / rect.height);
    ctx.fillStyle = '#5D4037';
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fill();
  }
}

function clearCanvas() {
  const canvas = document.getElementById('writingCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#f5f5f5';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#E0E0E0';
  ctx.lineWidth = 1;
  ctx.setLineDash([5, 5]);
  for (let y = 50; y < canvas.height; y += 50) {
    ctx.beginPath();
    ctx.moveTo(20, y);
    ctx.lineTo(canvas.width - 20, y);
    ctx.stroke();
  }
  ctx.setLineDash([]);
}

          ` : '<div style="margin-top:10px;color:#4CAF50;">✅ 阳光已领取</div>'}
        </div>
      ` : ''}
    </div>
  `;
  renderMathQuiz();
}

function generateMathQuiz() {
  const qs = [];
  // 10 addition/subtraction (2-digit)
  for (let i = 0; i < 10; i++) {
    const a = Math.floor(Math.random() * 90) + 10;
    const b = Math.floor(Math.random() * (a - 1)) + 1;
    const op = Math.random() > 0.5 ? '+' : '-';
    if (op === '+') {
      const b2 = Math.floor(Math.random() * (99 - a)) + 1;
      qs.push({ q: `${a} + ${b2} = ?`, a: a + b2, type: 'addsub' });
    } else {
      qs.push({ q: `${a} - ${b} = ?`, a: a - b, type: 'addsub' });
    }
  }
  // 10 multiplication/division (single digit)
  for (let i = 0; i < 10; i++) {
    const a = Math.floor(Math.random() * 9) + 1;
    const b = Math.floor(Math.random() * 9) + 1;
    if (i < 5) {
      qs.push({ q: `${a} × ${b} = ?`, a: a * b, type: 'muldiv' });
    } else {
      const product = a * b;
      qs.push({ q: `${product} ÷ ${a} = ?`, a: b, type: 'muldiv' });
    }
  }
  return qs;
}

let currentMathType = 'addsub';

function switchMathTab(type) {
  currentMathType = type;
  document.querySelectorAll('#page-math .tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && type === 'addsub') || (i === 1 && type === 'muldiv'));
  });
  renderMathQuiz();
}

function renderMathQuiz() {
  const area = document.getElementById('mathQuizArea');
  if (!area) return;
  const stored = localStorage.getItem('pvz_math_quiz');
  const quiz = stored ? JSON.parse(stored) : null;
  if (!quiz) return;

  const filtered = quiz.questions
    .map((q, i) => ({...q, idx: i}))
    .filter(q => q.type === currentMathType);

  area.innerHTML = filtered.map(q => {
    const isDone = state.mathDone.includes(q.idx);
    return `
      <div style="display:flex;align-items:center;gap:10px;padding:10px;background:${isDone?'#E8F5E9':'#fff'};border-radius:10px;margin-bottom:6px;">

        <input type="number" class="quiz-input" id="mathAns${q.idx}" ${isDone?'disabled':''}
               onkeydown="if(event.key==='Enter')checkMathAnswer(${q.idx},${q.a})">
        ${isDone ? '<span style="color:#4CAF50;font-size:20px;">✅</span>' :
          `<button class="btn btn-green btn-sm" onclick="checkMathAnswer(${q.idx},${q.a})">检查</button>`}

}

function checkMathAnswer(idx, correct) {
  const input = document.getElementById('mathAns' + idx);
  if (!input) return;
  const userAns = parseInt(input.value);
  if (isNaN(userAns)) { showToast('请输入答案哦~'); return; }
  if (userAns === correct) {
    state.mathDone.push(idx);
    saveState();
    showToast('✅ 回答正确！太聪明了！');
    renderMath();
    renderNav();
    updateGardenStatus();

function speakAllEnglish() {
  // Speak all words sequentially
  if (!('speechSynthesis' in window)) {
    showToast('⚠️ 当前浏览器不支持语音朗读');
    return;
  }
  activateSpeech();
  window.speechSynthesis.cancel();

  const words = englishWords.map(w => w.en);
  let idx = 0;
  function speakNext() {
    if (idx >= words.length) return;
    const u = new SpeechSynthesisUtterance(words[idx]);
    u.lang = 'en-US';
    u.rate = 0.75;
    u.pitch = 1.0;
    u.onend = () => { idx++; speakNext(); };
    window.speechSynthesis.speak(u);
  }
  speakNext();
  showToast('🔊 正在朗读所有英语单词...');
}

function markEnglishWord(index) {
  if (state.englishDone.includes(index)) return;
  state.englishDone.push(index);
  saveState();
  renderEnglish();
  renderNav();
  updateGardenStatus();
  if (state.englishDone.length >= 6) {
    showToast('🎉 英语单词学习完成！');
  }
}

function startEnglishGame() {
  const pairs = englishWords.slice(0, 6);
  const cards = [...pairs, ...pairs].map((w, i) => ({
    id: i, word: w.en, emoji: w.emoji, pairId: i % pairs.length
  })).sort(() => Math.random() - 0.5);

  englishGameState = { cards, flipped: [], matched: [], started: true };
  renderEnglishGame();
}

function renderEnglishGame() {
  const grid = document.getElementById('englishMatchGrid');
  if (!grid) return;
  grid.innerHTML = englishGameState.cards.map((c, i) => {
    const flipped = englishGameState.flipped.includes(i);
    const matched = englishGameState.matched.includes(c.pairId);
    return `
      <div class="match-cell ${flipped || matched ? 'flipped' : ''} ${matched ? 'matched' : ''}"
           onclick="flipEnglishCard(${i})">
        ${flipped || matched ? c.emoji : '?'}
      </div>`;
  }).join('');
}

function flipEnglishCard(index) {
  if (englishGameState.flipped.length >= 2) return;
  if (englishGameState.flipped.includes(index)) return;
  if (englishGameState.matched.includes(englishGameState.cards[index].pairId)) return;

  englishGameState.flipped.push(index);
  renderEnglishGame();

  if (englishGameState.flipped.length === 2) {
    const [a, b] = englishGameState.flipped;
    const cardA = englishGameState.cards[a];
    const cardB = englishGameState.cards[b];

    if (cardA.pairId === cardB.pairId && a !== b) {
      englishGameState.matched.push(cardA.pairId);
      englishGameState.flipped = [];
      renderEnglishGame();
      if (englishGameState.matched.length === 6) {
        showToast('🎉 全部消除！太厉害了！');
      }
    } else {
      setTimeout(() => {
        englishGameState.flipped = [];
        renderEnglishGame();
      }, 800);
    }
  }
}

// ===== Writing Canvas with Templates =====
function initWritingCanvas() {
  const canvas = document.getElementById('writingCanvas2');
  if (!canvas) return;

  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;

  ctx.fillStyle = '#fffef7';
  ctx.fillRect(0, 0, w, h);

  ctx.strokeStyle = '#C8E6C9';
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 4]);

  const margin = 30;

  switch (writingMode) {
    case 'line':
      for (let y = margin + 10; y < h - margin; y += 30) {
        ctx.beginPath();
        ctx.moveTo(margin, y);
        ctx.lineTo(w - margin, y);
        ctx.stroke();
        ctx.fillStyle = '#A5D6A7';
        drawArrow(ctx, w - margin, y, margin + 10, y);
      }
      break;
    case 'zigzag':
      for (let x = margin + 10; x < w - margin; x += 30) {
        ctx.beginPath();
        ctx.moveTo(x, margin);
        ctx.lineTo(x, h - margin);
        ctx.stroke();
      }
      break;
    case 'wave':
      for (let y = margin + 15; y < h - margin; y += 40) {
        ctx.beginPath();
        ctx.moveTo(margin, y);
        for (let x = margin; x < w - margin; x += 4) {
          ctx.lineTo(x, y + Math.sin((x - margin) * 0.04) * 12);
        }
        ctx.stroke();
      }
      break;
    case 'circle':
      const cx = w / 2, cy = h / 2;
      for (let r = 20; r < Math.min(w, h) / 2 - margin; r += 30) {
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.moveTo(cx, margin); ctx.lineTo(cx, h - margin);
      ctx.moveTo(margin, cy); ctx.lineTo(w - margin, cy);
      ctx.stroke();
      break;
  }

  ctx.setLineDash([]);

  ctx.fillStyle = '#C8E6C9';
  ctx.font = '12px "PingFang SC", "Microsoft YaHei", sans-serif';
  const titles = { line: '跟着绿色虚线画横线 →', zigzag: '跟着绿色虚线画竖线 ↓', wave: '跟着波浪线描红 〰', circle: '在虚线上画圆圈 ○' };
  ctx.fillText(titles[writingMode] || '', margin, margin - 8);

  let drawing = false;
  let lastX = 0, lastY = 0;
  const strokes = [];

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (w / rect.width),
      y: (e.clientY - rect.top) * (h / rect.height)
    };
  }

  function startDraw(e) {
    drawing = true;
    const pos = getPos(e.touches ? e.touches[0] : e);
    lastX = pos.x; lastY = pos.y;
    strokes.push([]);
    strokes[strokes.length-1].push({x: lastX, y: lastY});
  }

  function doDraw(e) {
    if (!drawing) return;
    e.preventDefault();
    const pos = getPos(e.touches ? e.touches[0] : e);
    ctx.strokeStyle = '#5D4037';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    lastX = pos.x; lastY = pos.y;
    strokes[strokes.length-1].push({x: lastX, y: lastY});
  }

  function endDraw() {
    drawing = false;
    if (strokes.length > 0 && strokes[strokes.length-1].length === 1) {
      strokes.pop();
    }
  }

  canvas.onmousedown = startDraw;
  canvas.onmousemove = doDraw;
  canvas.onmouseup = endDraw;
  canvas.onmouseleave = endDraw;

  canvas.ontouchstart = startDraw;
  canvas.ontouchmove = doDraw;
  canvas.ontouchend = endDraw;

  canvas._strokes = strokes;
}

function drawArrow(ctx, fromX, fromY, toX, toY) {
  const angle = Math.atan2(toY - fromY, toX - fromX);
  const size = 6;
  ctx.beginPath();
  ctx.moveTo(fromX, fromY);
  ctx.lineTo(fromX - size * Math.cos(angle - 0.5), fromY - size * Math.sin(angle - 0.5));
  ctx.moveTo(fromX, fromY);
  ctx.lineTo(fromX - size * Math.cos(angle + 0.5), fromY - size * Math.sin(angle + 0.5));
  ctx.stroke();
}

function clearWritingCanvas() {
  initWritingCanvas();
}

function undoWritingCanvas() {
  const canvas = document.getElementById('writingCanvas2');
  if (!canvas || !canvas._strokes) return;
  canvas._strokes.pop();
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fffef7';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  initWritingCanvas();
  if (canvas._strokes.length > 0) {
    ctx.strokeStyle = '#5D4037';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    canvas._strokes.forEach(stroke => {
      if (stroke.length < 2) return;
      ctx.beginPath();
      ctx.moveTo(stroke[0].x, stroke[0].y);
      for (let i = 1; i < stroke.length; i++) {
        ctx.lineTo(stroke[i].x, stroke[i].y);
      }
      ctx.stroke();
    });
  }
}

function removeError(id) {
  state.errorBook = state.errorBook.filter(e => e.id !== id);
  saveState();
  renderErrors();

}

function clearAllErrors() {
  if (confirm('确定要清空所有错题吗？')) {
    state.errorBook = [];
    saveState();
    renderErrors();
    showToast('🗑️ 错题本已清空');
  }
}

function exportErrors() {
  if (state.errorBook.length === 0) { showToast('没有错题可导出'); return; }
  let text = '📝 错题本 · 复习清单\n' + '='.repeat(30) + '\n\n';
  state.errorBook.forEach((e, i) => {
    text += `${i+1}. [${e.module}] ${e.type}\n   ${e.detail}\n   日期: ${e.date}\n\n`;
  });
  const blob = new Blob([text], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `错题本_${state.today}.txt`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('🖨️ 错题本已导出！');
}

function renderCalendar() {
  const pages = document.querySelectorAll('.module-page');
  // Add calendar to the last module page
  const lastPage = pages[pages.length - 1];
  if (!lastPage) return;

  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  let calHTML = '';
  const headers = ['日','一','二','三','四','五','六'];
  headers.forEach(h => { calHTML += `<div class="calendar-header">${h}</div>`; });

  for (let i = 0; i < firstDay; i++) {
    calHTML += `<div class="calendar-day empty"></div>`;
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = d === now.getDate();
    const record = state.calendar[dateStr];
    const isDone = record && record.allDone;
    const isMissed = !isDone && dateStr < state.today;
    let cls = 'calendar-day';
    if (isToday) cls += ' today';
    if (isDone) cls += ' done';
    else if (isMissed) cls += ' missed';

    calHTML += `<div class="${cls}" title="${dateStr}">${d}</div>`;
  }

  const calendarCard = document.createElement('div');
  calendarCard.className = 'card';
  calendarCard.innerHTML = `
    <div class="card-header">
      <span class="icon-title">📅</span>
      <span class="title">打卡日历 · ${year}年${month+1}月</span>
    </div>
    <div class="calendar-grid">${calHTML}</div>
    <div style="display:flex;gap:16px;margin-top:12px;font-size:12px;color:#757575;justify-content:center;">
      <span>🌻 全勤打卡</span>
      <span>🧟 漏打卡</span>
      <span>📅 今日</span>
    </div>
    <div style="text-align:center;margin-top:14px;">
      <button class="btn btn-primary btn-sm" onclick="generateMonthlyReport()">📊 生成本月学习报告</button>
    </div>
  `;
  lastPage.appendChild(calendarCard);
}

// ============================================
// UTILITY: Text to Speech (Robust Multi-platform)
// ============================================

let _speechReady = false;
let _zhVoice = null;

// Pre-load voices — iOS Safari needs this
function initSpeech() {
  if (!('speechSynthesis' in window)) return;
  const voices = window.speechSynthesis.getVoices();
  if (voices.length > 0) {
    _zhVoice = voices.find(v => v.lang.startsWith('zh-CN') || v.lang.startsWith('zh-TW') || v.lang.startsWith('zh-HK') || v.lang.startsWith('zh'));
  }
}
initSpeech();
window.speechSynthesis?.addEventListener('voiceschanged', initSpeech);

// Activate speech on first user tap (required by mobile browsers)
function activateSpeech() {
  if (_speechReady) return;
  if (!('speechSynthesis' in window)) return;
  // Speak a silent utterance to "unlock" the audio context
  const u = new SpeechSynthesisUtterance('');
  u.volume = 0;
  u.rate = 2;
  window.speechSynthesis.speak(u);
  _speechReady = true;
}

// Listen for first user interaction globally
['click','touchstart'].forEach(evt => {
  document.addEventListener(evt, activateSpeech, { once: true });
});

function speak(text, lang = 'zh-CN') {
  if (!('speechSynthesis' in window)) {
    showToast('⚠️ 当前浏览器不支持语音朗读');
    return;
  }

  // Ensure speech context is activated
  activateSpeech();

  // Cancel any ongoing speech
  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = lang;
  utterance.rate = lang.startsWith('zh') ? 0.8 : 0.85;
  utterance.pitch = 1.1;
  utterance.volume = 1;

  // Use pre-loaded Chinese voice if available
  if (_zhVoice && lang.startsWith('zh')) {
    utterance.voice = _zhVoice;
  }

  // iOS Safari fix: if voices empty, retry after voices load
  if (window.speechSynthesis.getVoices().length === 0) {
    window.speechSynthesis.addEventListener('voiceschanged', () => {
      initSpeech();
      if (_zhVoice && lang.startsWith('zh')) utterance.voice = _zhVoice;
      window.speechSynthesis.speak(utterance);
    }, { once: true });
    return;
  }

  // Chrome on Android fix: sometimes speech just silently fails,
  // resume if paused and retry
  window.speechSynthesis.speak(utterance);

  // Safety: if speech gets stuck paused (Chrome bug), resume it
  setTimeout(() => {
    if (window.speechSynthesis.paused) {
      window.speechSynthesis.resume();
    }
  }, 100);
}

// ============================================
// Speak single Chinese character with explanation
// ============================================
function speakChar(char, pinyin, group) {
  const fullText = `${char}，拼音：${pinyin}，组词：${group}`;
  speak(fullText, 'zh-CN');
}

// ============================================
// Speak English word
// ============================================
function speakEnglishWord(en, zh) {
  const text = `${en}，意思是：${zh}`;
  // Use English first then Chinese explanation
  if ('speechSynthesis' in window) {
    activateSpeech();
    window.speechSynthesis.cancel();

    // First utterance: English word
    const u1 = new SpeechSynthesisUtterance(en);
    u1.lang = 'en-US';
    u1.rate = 0.8;
    u1.pitch = 1.0;

    // Second utterance: Chinese explanation
    const u2 = new SpeechSynthesisUtterance(`，${zh}`);
    u2.lang = 'zh-CN';
    u2.rate = 0.8;
    u2.pitch = 1.1;
    if (_zhVoice) u2.voice = _zhVoice;

    // Speak sequentially
    u1.addEventListener('end', () => {
      window.speechSynthesis.speak(u2);
    });

    window.speechSynthesis.speak(u1);
  } else {
    showToast('⚠️ 当前浏览器不支持语音');
  }
}

// ============================================
// Speak pinyin syllable
// ============================================
function speakPinyin(py) {
  // Map pinyin letters/combinations to Chinese pronunciation descriptions
  // so TTS reads them as Chinese pinyin, not English letters
  const pinyinMap = {
    // 声母
    'b': 'bō 播', 'p': 'pō 坡', 'm': 'mō 摸', 'f': 'fō 佛',
    'd': 'dē 得', 't': 'tè 特', 'n': 'nè 呢', 'l': 'lè 乐',
    'g': 'gē 哥', 'k': 'kē 科', 'h': 'hē 喝',
    'j': 'jī 鸡', 'q': 'qī 七', 'x': 'xī 西',
    'zh': 'zhī 知', 'ch': 'chī 吃', 'sh': 'shī 诗', 'r': 'rì 日',
    'z': 'zī 资', 'c': 'cī 疵', 's': 'sī 思',
    'y': 'yī 衣', 'w': 'wū 屋',
    // 韵母
    'a': 'ā 啊', 'o': 'ō 喔', 'e': 'ē 鹅',
    'i': 'yī 衣', 'u': 'wū 乌', 'ü': 'yú 鱼',
    'ai': 'āi 哀', 'ei': 'ēi 欸', 'ui': 'uī 威',
    'ao': 'āo 凹', 'ou': 'ōu 欧', 'iu': 'yōu 优',
    'ie': 'yē 耶', 'üe': 'yuē 约', 'er': 'ér 儿',
    'an': 'ān 安', 'en': 'ēn 恩', 'in': 'yīn 因', 'un': 'wēn 温', 'ün': 'yūn 晕',
    'ang': 'āng 昂', 'eng': 'ēng 鞥', 'ing': 'yīng 英', 'ong': 'ōng 轰的韵母',
    // 整体认读
    'zhi': 'zhī 知', 'chi': 'chī 吃', 'shi': 'shī 诗', 'ri': 'rì 日',
    'zi': 'zī 资', 'ci': 'cī 疵', 'si': 'sī 思',
    'yi': 'yī 衣', 'wu': 'wū 乌', 'yu': 'yú 鱼',
    'ye': 'yē 耶', 'yue': 'yuē 约', 'yuan': 'yuān 冤',
    'yin': 'yīn 因', 'yun': 'yūn 晕', 'ying': 'yīng 英',
  };

  const pronunciation = pinyinMap[py] || py;
  speak(pronunciation, 'zh-CN');
}

function checkAllAndDefend() {
  const today = state.today;
  const literacyDone = state.literacyDone.length >= (state.dailyWords.words || []).length;
  const poemDone = state.poemDone.length >= 3;
  const mathDone = state.mathDone.length >= 20;
  const writingDone = state.writingDone.includes(today);
  const motionDone = state.motionDone.includes(today);

  if (literacyDone && poemDone && mathDone && writingDone && motionDone) {
    if (!state.calendar[today]?.allDone) {
      markDayComplete();
    }
  }

  // Use original function directly to avoid recursion
  originalUpdateGardenStatus();
}

// Call this after any module action
const originalUpdateGardenStatus = updateGardenStatus;
updateGardenStatus = function() {
  originalUpdateGardenStatus();
  checkAllAndDefend();
};

  `;

      });

      el.remove();
    }

  setTimeout(() => el.remove(), 10000);
}

  const el = document.getElementById('installHint');
  if (el) el.remove();
